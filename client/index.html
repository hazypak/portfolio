    <!--
      Boot screen: painted with the first byte so there is never an unstyled
      frame. main.tsx removes it once React has mounted and fonts are ready.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #05070b;
      }
      html.booting body {
        overflow: hidden;
      }
      #root {
        opacity: 0;
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      html.ready #root {
        opacity: 1;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            40rem 30rem at 50% 40%,
            rgba(64, 224, 240, 0.08),
            transparent 70%
          ),
          #05070b;
        color: #8a97a8;
        font:
          13px/1.9 "IBM Plex Mono",
          ui-monospace,
          Consolas,
          monospace;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      html.ready #boot {
        opacity: 0;
        visibility: hidden;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #eef2f7;
      }
      html[data-theme="light"] #boot {
        background:
          radial-gradient(
            40rem 30rem at 50% 40%,
            rgba(14, 116, 144, 0.08),
            transparent 70%
          ),
          #eef2f7;
        color: #4b5a6b;
      }
      html[data-theme="light"] #boot .ok {
        color: #0e7490;
      }
      html[data-theme="light"] #boot .prompt {
        color: #0b1220;
      }
      #boot .term {
        width: min(26rem, 84vw);
        opacity: 0;
        animation: boot-in 0.3s ease 0.15s forwards;
      }
      #boot .line {
        white-space: nowrap;
        overflow: hidden;
        width: 0;
        animation: boot-type 0.5s steps(28, end) forwards;
      }
      #boot .line:nth-child(2) {
        animation-delay: 0.35s;
      }
      #boot .line:nth-child(3) {
        animation-delay: 0.7s;
      }
      #boot .ok {
        color: #40e0f0;
      }
      #boot .prompt {
        color: #e8f0f4;
      }
      #boot .bar {
        margin-top: 14px;
        height: 2px;
        overflow: hidden;
        background: rgba(232, 240, 244, 0.08);
      }
      #boot .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #40e0f0, #a78bfa);
        animation: boot-scan 1.1s ease-in-out infinite;
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-type {
        to {
          width: 100%;
        }
      }
      @keyframes boot-scan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .term,
        #boot .line {
          animation: none;
          opacity: 1;
          width: auto;
        }
        #boot .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script type="application/ld+json">

  </head>
